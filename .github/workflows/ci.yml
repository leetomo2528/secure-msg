name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without this the token carries the repository default, which on an untouched
# repo is write on contents — handed to third-party actions pinned to mutable
# tags. No job here pushes anything.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action reports its findings as a pull request comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (incl. Socket.IO device-trust suite)
        run: python -m unittest discover -s tests -v
      - name: ruff (non-blocking lint, warns only)
        run: |
          pip install ruff
          ruff check . --exit-zero

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The E2E suites spawn the real Flask relay from server/.venv/bin/python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision relay server venv for E2E
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - run: npm ci
      - name: Unit + E2E tests
        run: npm test -- --run
      - name: Production build (tsc + vite + PWA)
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # lazysodium-android 5.2.0 ships Java 21 bytecode (class file 65),
          # so JVM unit tests need a 21+ runtime; AGP 8.6 supports it.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests load the system libsodium via JNA (SodiumAndroid ->
      # Native.register("sodium")); the runner image ships without it.
      - name: Install libsodium for JVM unit tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsodium-dev
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      # No emulator runs here, so the four androidTest suites would rot unseen
      # until someone opened Android Studio; compiling them is the cheap half.
      # tools/release-apk.sh carries the on-device half as a release step.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon
      - name: Debug APK (compile check; releases are signed by tools/release-apk.sh)
        run: ./gradlew assembleDebug --no-daemon

  crypto-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crypto-core
      - name: cargo test
        run: cargo test --quiet
      # tests/wasm_browser.rs is #![cfg(target_arch = "wasm32")], so the run
      # above compiles it to an empty binary and asserts nothing. Type-check the
      # wasm-bindgen adapter at least, before the PWA starts linking it.
      - name: cargo check (wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --all-targets
