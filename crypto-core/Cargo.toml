[package]
name = "securemsg-crypto-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
getrandom_old = { package = "getrandom", version = "=0.2.17", features = ["js"] }
openmls = { version = "=0.8.1", features = ["js"] }
openmls_basic_credential = { version = "=0.5.0", features = ["clonable"] }
openmls_memory_storage = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tls_codec = "=0.4.2"
wasm-bindgen = "=0.2.127"
zeroize = "=1.8.2"

[dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
