<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Secure Msg</title>
    <script>
      // Paint the page background before first paint so a slow bundle does not
      // flash white-on-white. One light palette now, so no theme branch.
      (function () {
        try {
          document.documentElement.style.backgroundColor = "#f6f7fb";
          localStorage.removeItem("securemsg-theme");
        } catch (e) { /* styling still applies from CSS */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
